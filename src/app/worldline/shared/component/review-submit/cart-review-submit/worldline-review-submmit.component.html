<div class="cx-review">

    <!-- TITLE -->
    <h3 class="cx-review-title d-none d-lg-block d-xl-block">
        {{ 'checkoutReview.review' | cxTranslate }}
    </h3>

    <div class="cx-review-summary row">
        <ng-container *ngIf="(steps$ | async).slice(0, -1) as steps">
            <div class="col-md-12 col-lg-6 col-xl-6 cx-review-payment-col">
                <ng-container *ngTemplateOutlet="poNumber"></ng-container>
                <ng-container *ngTemplateOutlet="paymentType"></ng-container>
            </div>
            <div class="col-md-12 col-lg-6 col-xl-6 cx-review-shipping-col">
                <ng-container *ngFor="let step of shippingSteps(steps)">
                    <ng-container [ngSwitch]="step.type[0]">
                        <ng-container *ngSwitchCase="deliveryAddress">
                            <ng-container *ngTemplateOutlet="shippingAddress"></ng-container>
                        </ng-container>
                        <ng-container *ngSwitchCase="deliveryMode">
                            <ng-container *ngTemplateOutlet="deliveryMode"></ng-container>
                        </ng-container>
                    </ng-container>
                </ng-container>
            </div>
        </ng-container>
    </div>

    <!-- PO NUMBER SECTION -->
    <ng-template #poNumber>
        <div *ngIf="poNumber$ | async" class="cx-review-summary-card">
            <cx-card [content]="getPoNumberCard(poNumber$ | async) | async"></cx-card>
            <div class="cx-review-summary-edit-step">
                <a [attr.aria-label]="'checkoutReview.editPaymentType' | cxTranslate" [routerLink]="
            {
              cxRoute: getCheckoutStepUrl(checkoutStepTypePaymentDetails)
            } | cxUrl
          "><cx-icon aria-hidden="true" [type]="iconTypes.PENCIL"></cx-icon></a>
            </div>
        </div>
    </ng-template>

    <!-- PAYMENT TYPE SECTION -->
    <ng-template #paymentType>
        <ng-container *ngIf="paymentInfo$ | async as paymentInfo">
            <ng-container *ngIf="paymentProducts$ | async as paymentProducts">
                <ng-container *ngIf="(steps$ | async).slice(0, -1) as steps">
                    <div class="cx-review-summary-card">
                        <cx-card [content]="getPaymentTypeCard(paymentInfo, paymentProducts) | async"></cx-card>
                        <div class="cx-review-summary-edit-step">
                            <a [routerLink]="
                  {
                    cxRoute: getPaymentProductsStepUrl(steps) } | cxUrl ">
                                <cx-icon [type]=" iconTypes.PENCIL"></cx-icon>
                            </a>
                        </div>
                    </div>
                </ng-container>
            </ng-container>
        </ng-container>

    </ng-template>

    <!-- SHIPPING ADDRESS SECTION -->
    <ng-template #shippingAddress>
        <div class="cx-review-summary-card cx-review-card-address">
            <ng-container *ngIf="deliveryAddress$ | async as deliveryAddress">
                <ng-container *ngIf="countryName$ | async as countryName"></ng-container>
                <cx-card [content]="getShippingAddressCard(deliveryAddress, countryName) | async
          "></cx-card>
            </ng-container>
            <div class="cx-review-summary-edit-step">
                <a [routerLink]="
              {
                cxRoute: getCheckoutStepUrl(checkoutStepType.DELIVERY_ADDRESS)
              } | cxUrl
            ">
                    <cx-icon [type]="iconTypes.PENCIL"></cx-icon>
                </a>
            </div>
        </div>
    </ng-template>

    <!-- DELIVERY MODE SECTION -->
    <ng-template #deliveryMode>
        <div class="cx-review-summary-card cx-review-card-shipping">
            <cx-card *ngIf="deliveryMode$ | async as deliveryMode"
                [content]="getDeliveryModeCard(deliveryMode) | async"></cx-card>
            <div class="cx-review-summary-edit-step">
                <a [routerLink]="
              { cxRoute: getCheckoutStepUrl(checkoutStepType.DELIVERY_MODE) }
                | cxUrl
            ">
                    <cx-icon [type]="iconTypes.PENCIL"></cx-icon>
                </a>
            </div>
        </div>
    </ng-template>

    <!-- CART ITEM SECTION -->
    <ng-container *ngIf="cart$ | async as cart">
        <div class="cx-review-cart-total d-none d-lg-block d-xl-block">
            {{
            'cartItems.cartTotal'
            | cxTranslate: { count: cart.deliveryItemsQuantity }
            }}:
            {{ cart.totalPrice?.formattedValue }}
        </div>
        <h4 class="cx-review-cart-heading d-block d-lg-none d-xl-none">
            {{ 'checkoutReview.placeOrder' | cxTranslate }}
        </h4>
        <div class="cx-review-cart-item col-md-12" *ngIf="entries$ | async as entries">
            <ng-container *ngIf="cart.appliedOrderPromotions as orderPromotions">
                <cx-promotions [promotions]="orderPromotions"></cx-promotions>
            </ng-container>

            <ng-template [cxOutlet]="CartOutlets.CART_ITEM_LIST" [cxOutletContext]="{
          items: entries,
          readonly: true,
          promotionLocation: promotionLocation,
        }">
            </ng-template>
        </div>
    </ng-container>
</div>
